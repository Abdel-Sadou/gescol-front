@if (data(); as d) {
  <cob-dashboard-hero
    [badge]="badge"
    [greeting]="greeting()"
    [focus]="focus()"
    [facts]="facts()"
  />

  <cob-kpi-grid [kpis]="kpis()" />

  <div class="main-grid">
    <cob-task-queue [taches]="d.taches" [busyId]="busyId()" (act)="onAct($event)" />

    <section class="panel" aria-labelledby="gate-title">
      <header class="panel__head gate__head">
        <h2 class="panel__title" id="gate-title">Portail — aujourd'hui</h2>
        <span class="panel__aside">Bons de sortie / entrée</span>
      </header>

      @if (gate().length === 0) {
        <p class="panel__hint">Aucune sortie enregistrée aujourd'hui.</p>
      } @else {
        <ol class="gate">
          @for (g of gate(); track g.id) {
            <li class="gate__item">
              <span class="gate__time">{{ g.time }}</span>
              <span class="gate__rail" aria-hidden="true">
                <span class="gate__dot" [class]="'gate__dot--' + g.kind"></span>
              </span>
              <div class="gate__body">
                <p class="gate__line">
                  <span class="gate__name">{{ g.name }}</span>
                  <span class="gate__chip" [class]="'gate__chip--' + g.kind">{{ g.status }}</span>
                </p>
                <p class="gate__meta">{{ g.meta }}</p>
              </div>
            </li>
          }
        </ol>
      }
    </section>
  </div>
} @else {
  <cob-dashboard-state [status]="status()" (retry)="reload()" />
}
